name: Dashboard CI and Azure deployment

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22.22"
      - run: npm ci
      - run: npm run check
      - name: Save checked production build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-dist
          path: dist
          include-hidden-files: true
          retention-days: 3

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22.22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download checked production build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard-dist
          path: dist
      - name: Publish dashboard
        id: publish
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Verify the hosted dashboard and deployed assets
        env:
          DASHBOARD_URL: ${{ steps.publish.outputs.static_web_app_url }}
        run: |
          set -euo pipefail
          test -n "$DASHBOARD_URL"
          site="${DASHBOARD_URL%/}"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            --retry-max-time 120 --connect-timeout 10 --max-time 15 "$site/" -o /tmp/hosted-index.html
          curl --fail --silent --show-error --connect-timeout 10 --max-time 15 "$site/login" >/dev/null
          python3 - "$site" <<'PYCODE'
          import hashlib
          from html.parser import HTMLParser
          from pathlib import Path
          import sys
          import urllib.request

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = set()
              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if name in ("src", "href") and value and value.startswith("/assets/"):
                          self.paths.add(value)

          expected, hosted = Assets(), Assets()
          expected.feed(Path("dist/index.html").read_text())
          hosted.feed(Path("/tmp/hosted-index.html").read_text())
          if not expected.paths or hosted.paths != expected.paths:
              raise SystemExit("Hosted page does not reference the deployed build's assets")
          for asset in sorted(expected.paths):
              with urllib.request.urlopen(sys.argv[1] + asset, timeout=15) as response:
                  payload = response.read()
              local = Path("dist" + asset).read_bytes()
              if hashlib.sha256(payload).digest() != hashlib.sha256(local).digest():
                  raise SystemExit("Hosted asset does not match the checked build: " + asset)
          print("Hosted login route and checked build assets verified")
          PYCODE
